.python_gate:
  image: weekend-report-ci:python314

config-validation:
  extends: .python_gate
  stage: validate
  script:
    - python scripts/ci.py config

ruff:
  extends: .python_gate
  stage: quality
  needs: [config-validation]
  script:
    - python scripts/ci.py lint

mypy:
  extends: .python_gate
  stage: quality
  needs: [config-validation]
  script:
    - python scripts/ci.py typecheck

unit-tests:
  extends: .python_gate
  stage: quality
  needs: [config-validation]
  script:
    - python scripts/ci.py unit

integration-tests:
  extends: .python_gate
  stage: quality
  needs: [config-validation]
  script:
    - python scripts/ci.py integration

contract-tests:
  extends: .python_gate
  stage: quality
  needs: [config-validation]
  script:
    - python scripts/ci.py contract

postgres-concurrency:
  extends: .python_gate
  stage: quality
  needs: [config-validation]
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: weekend_report_ci_test
    POSTGRES_USER: weekend_report_ci
    POSTGRES_PASSWORD: ci-only-postgres-password
    WEEKEND_REPORT_TEST_POSTGRES_URL: postgresql://weekend_report_ci:ci-only-postgres-password@postgres:5432/weekend_report_ci_test
    WEEKEND_REPORT_TEST_POSTGRES_DISPOSABLE: "1"
  script:
    - python scripts/ci.py postgres

safe-e2e:
  extends: .python_gate
  stage: quality
  needs: [config-validation]
  script:
    - python scripts/ci.py e2e

docker-compose-validate:
  image: weekend-report-ci:python314
  stage: quality
  needs: [config-validation]
  script:
    - python scripts/ci.py compose-config
