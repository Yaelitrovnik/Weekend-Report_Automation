x-weekend-env-files: &weekend_env_files
  - ./env/app.env
  - ./env/portainer.env
  - ./env/doctor.env
  - ./env/rabbitmq.env
  - ./env/recording.env
  - ./env/infrastructure.env
  - ./env/splunk.env

x-app-volumes: &app_volumes
  - evidence:/app/runs
  - ./config/rules.yml:/app/config/rules.yml:ro
  - ./secrets:/app/secrets:ro

x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./env/app.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    logging: *default_logging

  web:
    image: ${WEEKEND_REPORT_IMAGE:-weekend-report:local}
    command:
      - uvicorn
      - app.web.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    env_file: *weekend_env_files
    expose:
      - "8080"
    volumes: *app_volumes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    logging: *default_logging

  worker:
    image: ${WEEKEND_REPORT_IMAGE:-weekend-report:local}
    command:
      - python
      - -m
      - app.worker.main
    env_file: *weekend_env_files
    volumes: *app_volumes
    depends_on:
      postgres:
        condition: service_started
    networks:
      - backend
      - egress
    restart: unless-stopped
    logging: *default_logging

volumes:
  db-data:
  evidence:

networks:
  frontend:
  egress:
  backend:
    internal: true
