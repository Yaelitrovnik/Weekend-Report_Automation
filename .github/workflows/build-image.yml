name: Build Verified Image

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - TAG

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Pre-image quality gates
    uses: ./.github/workflows/quality-gates.yml

  build-smoke-export:
    name: Build, smoke, then export image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Derive immutable build identity
        id: identity
        shell: bash
        run: bash .github/scripts/derive-build-identity.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build runtime base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.runtime-base
          load: true
          push: false
          tags: weekend-report-runtime-base:python314

      - name: Build image only after all pre-image gates pass
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.identity.outputs.image_tag }}
          labels: |
            org.opencontainers.image.title=Weekend Report Automation
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.weekend-report.build-id=${{ steps.identity.outputs.build_id }}

      - name: Record exact built image ID
        shell: bash
        run: bash .github/scripts/record-built-image.sh "${{ steps.identity.outputs.image_tag }}"

      - name: Smoke-test the exact built image
        env:
          WEEKEND_REPORT_APP_VERSION: ${{ steps.identity.outputs.version }}
          WEEKEND_REPORT_BUILD_ID: ${{ steps.identity.outputs.build_id }}
        run: python scripts/ci.py image-smoke --image "${{ steps.identity.outputs.image_tag }}"

      - name: Version-tag the exact smoked image
        shell: bash
        run: bash .github/scripts/version-tag-smoked-image.sh "${{ steps.identity.outputs.image_tag }}" "${{ steps.identity.outputs.release_image_tag }}"

      - name: Export verified offline image artifact
        shell: bash
        run: bash .github/scripts/export-verified-image.sh "${{ steps.identity.outputs.release_image_tag }}" "${{ steps.identity.outputs.archive_base }}"

      - name: Upload verified image artifact
        uses: actions/upload-artifact@v6
        with:
          name: verified-weekend-report-image-${{ steps.identity.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Decide whether registry publication is enabled
        id: publish
        shell: bash
        env:
          TAG_PUBLISH: ${{ vars.WEEKEND_REPORT_PUBLISH_IMAGE || '0' }}
        run: bash .github/scripts/decide-publish.sh

      - name: Authenticate to GHCR after smoke passes
        if: steps.publish.outputs.enabled == 'true'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/login-ghcr.sh

      - name: Publish the exact verified image
        if: steps.publish.outputs.enabled == 'true'
        shell: bash
        env:
          PUBLISH_LATEST: ${{ vars.WEEKEND_REPORT_PUBLISH_LATEST || '0' }}
        run: bash .github/scripts/publish-verified-image.sh "${{ steps.identity.outputs.release_image_tag }}" "${{ steps.identity.outputs.short_sha }}" "${{ steps.identity.outputs.version }}"
